<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
@font-face { font-family: 'Strider'; src: url('../assets/fonts/Strider.otf') format('opentype'); }
:root { --bg:#f7ecd4; --ink:#1d1509; --pop:#ffd23f; --accent:#f2611d; }
* { box-sizing: border-box; margin: 0; }
html, body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sq { width: 3in; height: 3in; background: var(--bg); color: var(--ink); border-radius: .18in; overflow: hidden;
  display: grid; grid-template-rows: 1.55in 1fr; font-family: 'DM Sans', sans-serif; position: relative; }
.sq img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; display: block; }
.sq .bottom { display: grid; grid-template-columns: 1.1in 1fr; gap: .12in; padding: .14in .16in; align-items: center; }
.sq svg { width: 1.1in; height: 1.1in; display: block; background: #fff; padding: .07in; border: 2.5px solid var(--ink); border-radius: .08in; }
.sq .title { font-family: 'Strider', serif; font-size: 25pt; line-height: .95; }
.sq .who { font-family: 'Caveat', cursive; font-weight: 700; font-size: 15pt; line-height: 1; margin-bottom: .04in; }
.sq .scan { font-weight: 700; font-size: 7.6pt; letter-spacing: .04em; text-transform: uppercase; margin-top: .08in; }
.sq .url { font-size: 7.6pt; opacity: .75; }
.sq .new { position: absolute; top: .12in; right: -.3in; background: var(--pop); color: var(--ink); border: 2.5px solid var(--ink);
  font-family: 'Caveat', cursive; font-weight: 700; font-size: 12pt; line-height: 1; padding: .05in .45in; transform: rotate(14deg); }
.rd { width: 2.5in; height: 2.5in; border-radius: 50%; background: var(--pop); color: var(--ink); border: 3px solid var(--ink);
  display: grid; place-items: center; align-content: center; gap: .05in; font-family: 'DM Sans', sans-serif; text-align: center; }
.rd svg { width: 1.25in; height: 1.25in; display: block; background: #fff; padding: .08in; border: 2.5px solid var(--ink); border-radius: .08in; }
.rd .who { font-family: 'Strider', serif; font-size: 16pt; line-height: 1; margin-top: .06in; }
.rd .scan { font-family: 'Caveat', cursive; font-weight: 700; font-size: 13pt; line-height: 1; }
.rd .url { font-size: 7pt; font-weight: 700; letter-spacing: .04em; }
@page { size: letter; margin: 0; }
.sheet { width: 8.5in; height: 11in; page-break-after: always; display: grid; place-content: center; gap: .3in; }
.sheet.squares { grid-template-columns: repeat(2, 3in); }
.sheet.rounds { grid-template-columns: repeat(3, 2.5in); }
.single { width: max-content; }
</style></head><body>
